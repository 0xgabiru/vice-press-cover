<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Press — multi-panel neon cover studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <aside class="controls">
    <h1>Vice Press</h1>
    <p class="tagline">Your photos never leave this machine.</p>

    <section>
      <h2>Photos</h2>
      <p class="hint">Click a photo to put it in the selected panel. Click a panel in the preview to select it, drag inside it to pan.</p>
      <div id="tray" class="tray"></div>
      <label class="upload">Upload your photos (up to 4)
        <input id="upload" type="file" accept="image/*" multiple>
      </label>
    </section>

    <section>
      <h2>Layout</h2>
      <div id="layouts" class="picker layouts"></div>
    </section>

    <section>
      <h2>Grade</h2>
      <div id="grades" class="picker grades"></div>
    </section>

    <section>
      <h2>Lettering</h2>
      <label>Title <input id="title" type="text" maxlength="28" value="PALM CITY"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="40" value="golden hour in palm city"></label>
      <label>Badge <input id="badge" type="text" maxlength="18" value="EST. 2026"></label>
    </section>

    <section class="panel-section">
      <h2>Selected panel</h2>
      <label>Zoom <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1"> <span id="zoom-value">1.00×</span></label>
      <button id="reset-panel" type="button">Reset panel crop</button>
    </section>

    <section>
      <h2>Size</h2>
      <div id="sizes" class="picker sizes"></div>
      <button id="export-all" type="button" class="primary">Export all 4 sizes (PNG)</button>
      <p id="status" role="status"></p>
    </section>

    <section class="history">
      <button id="undo" type="button">Undo</button>
      <button id="redo" type="button">Redo</button>
      <span class="hint">Ctrl+Z / Ctrl+Shift+Z</span>
    </section>
  </aside>

  <section class="preview">
    <div class="preview-wrap">
      <canvas id="cover" width="900" height="506" aria-label="The cover preview"></canvas>
      <div id="panel-hint" class="panel-hint"></div>
    </div>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
